<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <main class="signup-container">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 11v9l6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="brand-name">Quiz App</span>
        </div>

        <h1>Create your account</h1>
        <p class="subhead">Start a streak you can brag about.</p>

        <form id="signupForm" novalidate>
            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    minlength="3"
                    autocomplete="username"
                    placeholder="Pick a username"
                    aria-describedby="username-error"
                >
                <span class="field-error" id="username-error" role="alert"></span>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                    aria-describedby="email-error"
                >
                <span class="field-error" id="email-error" role="alert"></span>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="At least 8 characters"
                        aria-describedby="password-error"
                    >
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
                            <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.6 6.7C4 8.3 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.45 4.8-1.2M17.4 17.4C19.9 15.8 22 12 22 12s-1.2-2.35-3.4-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <span class="field-error" id="password-error" role="alert"></span>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        aria-describedby="confirm-error"
                    >
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
                            <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.6 6.7C4 8.3 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.45 4.8-1.2M17.4 17.4C19.9 15.8 22 12 22 12s-1.2-2.35-3.4-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <span class="field-error" id="confirm-error" role="alert"></span>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-label">Sign up</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <p class="form-error" id="formError" role="alert"></p>
        </form>

        <p class="switch-auth">Already have an account? <a href="login.html">Log in</a></p>
    </main>

    <script src="signup.js" defer></script>
</body>
</html>
